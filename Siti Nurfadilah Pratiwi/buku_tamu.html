<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buku Tamu</title>
  <link rel="stylesheet" href="bootstrap-5.3.8-dist/css/bootstrap.css">

  <!-- Custom Style -->
  <style>
    .bg-red {
      background-color: #dc3545; /* merah */
    }
    body {
      background-color: #fff5f5; /* merah muda pucat untuk background halaman */
    }
    h2, h3, label {
      color: #b02a37; /* merah gelap untuk teks */
    }
    .nav-link {
      color: #b02a37;
    }
    .nav-link:hover {
      color: #7a1e27;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Header -->
    <div class="row bg-red text-white text-center p-4">
      <div class="col-12">
        <!-- Foto Profil -->
        <img src="foto.jpg" class="rounded-circle mx-auto d-block" width="120" height="120" alt="Foto Profil">
        <h2 class="mt-3">Siti Nurfadilah Pratiwi AS</h2>
      </div>
    </div>

    <!-- Main Content -->
    <div class="row mt-3">
      <!-- Sidebar -->
      <div class="col-3">
        <ul class="nav flex-column">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Profil</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Galeri</a></li>
          <li class="nav-item"><a class="nav-link active" href="buku_tamu.html">Buku Tamu</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Kontak</a></li>
        </ul>
      </div>

      <!-- Form Buku Tamu -->
      <div class="col-9">
        <h3 class="mb-4">Form Buku Tamu</h3>
        <form class="form">
          <!-- Nama -->
          <div class="mb-3">
            <label for="nama" class="form-label">Username</label>
            <input type="text" id="nama" name="nama" class="form-control" placeholder="Masukkan nama Anda">
          </div>

          <!-- Select -->
          <div class="mb-3">
            <label for="angka" class="form-label">Pilih Angka</label>
            <select id="angka" class="form-select">
              <option>1</option>
              <option>2</option>
              <option>3</option>
              <option>4</option>
            </select>
          </div>

          <!-- Checkbox -->
          <div class="mb-3">
            <div class="form-check">
              <input type="checkbox" class="form-check-input" id="check1">
              <label class="form-check-label" for="check1">Setuju dengan syarat</label>
            </div>
            <div class="form-check">
              <input type="checkbox" class="form-check-input" id="check2">
              <label class="form-check-label" for="check2">Langganan berita</label>
            </div>
          </div>

          <!-- Tombol -->
          <button type="submit" class="btn btn-lg" style="background-color:#dc3545; color:white;">Kirim</button>
          <button type="reset" class="btn btn-secondary">Reset</button>
          <a href="index.html" class="btn btn-link">Kembali</a>
        </form>
      </div>
    </div>

    <!-- Footer -->
    <div class="row bg-red text-white text-center p-2 mt-3">
      <div class="col-12">
        <small>by Belajar.net</small>
      </div>
    </div>
  </div>

  <script src="bootstrap-5.3.8-dist/js/bootstrap.bundle.js"></script>
</body>
</html>
