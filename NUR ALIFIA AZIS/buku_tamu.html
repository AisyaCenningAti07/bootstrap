<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Form Buku Tamu</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
  <div class="card shadow p-4">
    <h3 class="text-center mb-4">Form Buku Tamu</h3>

    <form>
      <!-- Nama Lengkap -->
      <div class="mb-3">
        <label class="form-label">Nama Lengkap :</label>
        <input type="text" class="form-control" name="nama" required>
      </div>

      <!-- Jenis Kelamin -->
      <div class="mb-3">
        <label class="form-label">Jenis Kelamin :</label><br>
        <input type="radio" name="gender" value="Laki-laki"> Laki-laki
        <input type="radio" name="gender" value="Perempuan" class="ms-3"> Perempuan
      </div>

      <!-- Alamat -->
      <div class="mb-3">
        <label class="form-label">Alamat Tinggal :</label>
        <input type="text" class="form-control" name="alamat">
      </div>

      <!-- Email -->
      <div class="mb-3">
        <label class="form-label">Email :</label>
        <input type="email" class="form-control" name="email">
      </div>

      <!-- Sosial Media -->
      <div class="mb-3">
        <label class="form-label">Aktif pada sosial media:</label><br>
        <input type="checkbox" name="sosmed" value="Facebook"> Facebook
        <input type="checkbox" name="sosmed" value="Twitter" class="ms-3"> Twitter
        <input type="checkbox" name="sosmed" value="Instagram" class="ms-3"> Instagram
        <input type="checkbox" name="sosmed" value="Tiktok" class="ms-3"> Tiktok
      </div>

      <!-- Dropdown -->
      <div class="mb-3">
        <label class="form-label">Mengetahui web ini dari:</label>
        <select class="form-select" name="sumber">
          <option selected disabled>-- Pilih --</option>
          <option value="Teman">Teman</option>
          <option value="Iklan">Iklan</option>
          <option value="Media Sosial">Media Sosial</option>
          <option value="Lainnya">Lainnya</option>
        </select>
      </div>

      <!-- Pesan -->
      <div class="mb-3">
        <label class="form-label">Pesan :</label>
        <textarea class="form-control" name="pesan" rows="3"></textarea>
      </div>

      <!-- Tombol Submit -->
      <div class="d-grid">
        <input type="submit" value="Kirim" class="btn btn-primary">
      </div>
    </form>
  </div>
</div>

</body>
</html>
