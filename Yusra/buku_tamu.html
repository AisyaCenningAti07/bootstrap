<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Buku Tamu Bootstrap</title>
    <link rel="stylesheet" href="css/bootstrap.css">
</head>
<body>
    <div class="container my-5">
        <h2 class="mb-4">Form Buku Tamu</h2>
        
        <form class="form">
            <div class="mb-3">
                <label for="nama_lengkap" class="form-label">Nama Lengkap:</label>
                <input type="text" name="nama_lengkap" id="nama_lengkap" class="form-control" size="40">
            </div>

            <div class="mb-3">
                <label class="form-label">Jenis Kelamin:</label><br>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="jenis_kelamin" id="jkL" value="L" checked>
                    <label class="form-check-label" for="jkL">Laki-laki</label>
                </div>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="jenis_kelamin" id="jkP" value="P">
                    <label class="form-check-label" for="jkP">Perempuan</label>
                </div>
            </div>

            <div class="mb-3">
                <label for="alamat" class="form-label">Alamat Tinggal:</label>
                <input type="text" name="alamat" id="alamat" class="form-control" size="40">
            </div>

            <div class="mb-3">
                <label for="email" class="form-label">Email:</label>
                <input type="email" name="email" id="email" class="form-control" size="40">
            </div>

            <div class="mb-3">
                <label class="form-label">Aktif pada sosial media:</label><br>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="checkbox" name="facebook" id="cbFacebook" value="Ya">
                    <label class="form-check-label" for="cbFacebook">Facebook</label>
                </div>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="checkbox" name="twitter" id="cbTwitter" value="Ya">
                    <label class="form-check-label" for="cbTwitter">Twitter</label>
                </div>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="checkbox" name="instagram" id="cbInstagram" value="Ya">
                    <label class="form-check-label" for="cbInstagram">Instagram</label>
                </div>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="checkbox" name="path" id="cbPath" value="Ya">
                    <label class="form-check-label" for="cbPath">Path</label>
                </div>
            </div>

            <div class="mb-3">
                <label for="info" class="form-label">Mengetahui web ini dari:</label>
                <select name="info" id="info" class="form-select">
                    <option selected>-- Pilih --</option>
                    <option value="web">Web</option>
                    <option value="surat kabar">Surat Kabar</option>
                    <option value="teman kerabat">Teman/Kerabat</option>
                    <option value="browsing internet">Browsing Internet</option>
                </select>
            </div>

            <div class="mb-3">
                <label for="pesan" class="form-label">Pesan:</label>
                <textarea name="pesan" id="pesan" class="form-control" rows="3" cols="40"></textarea>
            </div>

            <input type="submit" value="Kirim" class="btn btn-primary">
        </form>
    </div>
    <script src="js/bootstrap.bundle.js"></script>
</body>
</html>
