}

  color: #ff1493 !important;   
}
  </style>

<body>

  <div class="container">
    
    <div class="row">
      <div class="col-12 bg-primary text-center p-3">
        <img src="fotoo.jpg" class="rounded-circle mx-auto d-block" width="100" alt="Logo">
        <h1 class="text-white">Nur Fadhillah Sunandar</h1>
      </div>
    </div>

    
    <div class="row mt-3">
      
      <div class="col-3">
        <ul class="nav flex-column">
          <li class="nav-item"><a class="nav-link active" href="#">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Profil</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Galeri</a></li>

          <li class="nav-item"><a class="nav-link" href="#">Kontak</a></li>
        </ul>
      </div>

      
      <div class="col-9">
        <h2 class="text-primary"> annyeong >< </h2>
        <p>
          Lorem ipsum dolor sit amet, consectetur adipiscing elit. 
          Bootstrap mempermudah kita membuat layout responsive 
          dengan cepat.
        </p>

        
        <h3 class="mt-4 text-primary">Form Buku Tamu</h3>
        <form class="form">
          
          <div class="mb-3">
            <label for="username" class="form-label">Username</label>
            <input type="text" id="username" class="form-control" placeholder="Masukkan username">
          </div>

          
          <div class="mb-3">
            <label for="pilihan" class="form-label">Pilih Angka</label>
            <select id="pilihan" class="form-select">
              <option>1</option>
              <option>2</option>
              <option>3</option>
              <option>4</option>
            </select>
          </div>

          
          <div class="form-check mb-2">
            <input type="checkbox" class="form-check-input" id="check1" checked>
            <label class="form-check-label" for="check1">Setuju dengan syarat</label>
          </div>
          <div class="form-check mb-2">
            <input type="checkbox" class="form-check-input" id="check2">
            <label class="form-check-label" for="check2">Langganan berita</label>
          </div>

          
          <div class="form-check">
            <input type="radio" class="form-check-input" id="radio1" name="optradio" checked>
            <label class="form-check-label" for="radio1">Laki-laki</label>
          </div>
          <div class="form-check mb-3">
            <input type="radio" class="form-check-input" id="radio2" name="optradio">
            <label class="form-check-label" for="radio2">Perempuan</label>
          </div>

          
          <button type="submit" class="btn btn-primary">Kirim</button>
        </form>
      </div>
    </div>

    
    <div class="row mt-4">
      <div class="col-12 bg-dark text-white text-center p-3">
        &copy; 2025 Praktikum Bootstrap
