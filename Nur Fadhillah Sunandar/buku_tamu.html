<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buku Tamu</title>
  <link rel="stylesheet" href="css/bootstrap.css">
</head>
<body>
  <div class="container mt-4">
    <h2 class="text-center mb-4">Form Buku Tamu</h2>

    <form class="form">
      <!-- Nama Lengkap -->
      <div class="mb-3">
        <label for="nama_lengkap" class="form-label">Nama Lengkap</label>
        <input type="text" id="nama_lengkap" name="nama_lengkap" class="form-control" placeholder="Masukkan nama lengkap">
      </div>

      <!-- Jenis Kelamin -->
      <div class="mb-3">
        <label class="form-label">Jenis Kelamin</label><br>
        <div class="form-check form-check-inline">
          <input type="radio" id="laki" name="jenis_kelamin" value="L" class="form-check-input" checked>
          <label for="laki" class="form-check-label">Laki-laki</label>
        </div>
        <div class="form-check form-check-inline">
          <input type="radio" id="perempuan" name="jenis_kelamin" value="P" class="form-check-input">
          <label for="perempuan" class="form-check-label">Perempuan</label>
        </div>
      </div>

      <!-- Alamat -->
      <div class="mb-3">
        <label for="alamat" class="form-label">Alamat Tinggal</label>
        <input type="text" id="alamat" name="alamat" class="form-control" placeholder="Masukkan alamat">
      </div>

      <!-- Email -->
      <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input type="email" id="email" name="email" class="form-control" placeholder="contoh@email.com">
      </div>

      <!-- Sosial Media -->
      <div class="mb-3">
        <label class="form-label">Aktif pada Sosial Media</label><br>
        <div class="form-check">
          <input type="checkbox" id="facebook" name="facebook" class="form-check-input" checked>
          <label for="facebook" class="form-check-label">Facebook</label>
        </div>
        <div class="form-check">
          <input type="checkbox" id="twitter" name="twitter" class="form-check-input">
          <label for="twitter" class="form-check-label">Twitter</label>
        </div>
        <div class="form-check">
          <input type="checkbox" id="instagram" name="instagram" class="form-check-input">
          <label for="instagram" class="form-check-label">Instagram</label>
        </div>
        <div class="form-check">
          <input type="checkbox" id="path" name="path" class="form-check-input">
          <label for="path" class="form-check-label">Path</label>
        </div>
      </div>

      <!-- Mengetahui Web -->
      <div class="mb-3">
        <label for="info" class="form-label">Mengetahui web ini dari</label>
        <select id="info" name="info" class="form-select">
          <option selected>Pilih --</option>
          <option value="web">Web</option>
          <option value="surat_kabar">Surat Kabar</option>
          <option value="teman_kerabat">Teman/Kerabat</option>
          <option value="browsing_internet">Browsing Internet</option>
        </select>
      </div>

      <!-- Pesan -->
      <div class="mb-3">
        <label for="pesan" class="form-label">Pesan</label>
        <textarea id="pesan" name="pesan" class="form-control" rows="3" placeholder="Tulis pesan..."></textarea>
      </div>

      <!-- Tombol Submit -->
      <button type="submit" class="btn btn-primary">Kirim</button>
    </form>
  </div>

  <script src="js/bootstrap.bundle.js"></script>
</body>
</html>
