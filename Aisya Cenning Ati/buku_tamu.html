<!DOCTYPE html>
<html lang="id">
<head> 
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Belajar Bootstrap</title>
    <link rel="stylesheet" href="css/bootstrap.css">
</head>
<body>
    <div class="container">
        <h2 class="my-4">Form Buku Tamu</h2>
        <form class="form">
            <div class="mb-3">
                <label for="nama" class="form-label">Nama Lengkap :</label>
                <input type="text" class="form-control" id="nama" name="nama_lengkap" size="40">
            </div>

            <div class="mb-3">
                <label class="form-label">Jenis Kelamin :</label><br>
                <input type="radio" name="jenis_kelamin" value="L" checked> Laki-laki
                <input type="radio" name="jenis_kelamin" value="P"> Perempuan
            </div>

            <div class="mb-3">
                <label for="alamat" class="form-label">Alamat Tinggal :</label>
                <input type="text" class="form-control" id="alamat" name="alamat" size="40">
            </div>

            <div class="mb-3">
                <label for="email" class="form-label">Email :</label>
                <input type="text" class="form-control" id="email" name="email" size="40">
            </div>

            <div class="mb-3">
                <label class="form-label">Aktif pada sosial media :</label><br>
                <input type="checkbox" name="facebook" value="Ya" checked> Facebook
                <input type="checkbox" name="twitter" value="Ya" checked> Twitter
                <input type="checkbox" name="instagram" value="Ya" checked> Instagram
                <input type="checkbox" name="path" value="Ya"> Path
            </div>

            <div class="mb-3">
                <label for="info" class="form-label">Mengetahui web ini dari :</label>
                <select name="info" id="info" class="form-select">
                    <option selected="select">-= Pilih =-</option>
                    <option value="web">Web</option>
                    <option value="surat kabar">Surat Kabar</option>
                    <option value="teman kerabat">Teman/Kerabat</option>
                    <option value="browsing internet">Browsing Internet</option>
                </select>
            </div>

            <div class="mb-3">
                <label for="pesan" class="form-label">Pesan :</label>
                <textarea name="pesan" id="pesan" class="form-control" cols="40"></textarea>
            </div>

            <input type="submit" class="btn btn-primary" value="Kirim">
        </form>
    </div>
</body>
</html>
